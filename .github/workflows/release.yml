name: Release PlainShell Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore PlainShell.csproj

      - name: Publish Single-File Executable
        run: |
          dotnet publish PlainShell.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -o ./publish

      - name: Copy Assets & Documentation
        run: |
          Copy-Item ./Assets/commands.json -Destination ./publish/commands.json -Force
          Copy-Item ./README.md -Destination ./publish/README.md -Force
          if (!(Test-Path ./dist)) { New-Item -ItemType Directory -Path ./dist | Out-Null }
          Copy-Item ./publish/* -Destination ./dist -Force -Recurse

      - name: Build Windows Setup Installer
        run: |
          choco install innosetup --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Create Release Zip Archive
        run: |
          Compress-Archive -Path ./publish/* -DestinationPath ./PlainShell-windows-x64.zip -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: PlainShell ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true
          files: |
            ./dist-installer/PlainShell-Setup-x64.exe
            ./publish/PlainShell.exe
            PlainShell-windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
